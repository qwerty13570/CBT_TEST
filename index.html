<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>등용문 CBT</title>
<style>
:root{
  --bg:#f3f8ff;--bg2:#eef6ff;--card:#ffffff;--soft:#f7fbff;--text:#172033;--muted:#667085;
  --line:#d7e3f3;--accent:#2563eb;--accent2:#0ea5e9;--good:#16a34a;--bad:#dc2626;--warn:#f59e0b;
  --btn:#f0f7ff;--btnHover:#dceeff;--shadow:0 12px 30px rgba(37,99,235,.10)
}
body.dark{
  --bg:#111827;--bg2:#0f172a;--card:#182235;--soft:#101827;--text:#e5e7eb;--muted:#a5b4c8;
  --line:#334155;--accent:#60a5fa;--accent2:#38bdf8;--btn:#1f2a3d;--btnHover:#26364f;--shadow:0 12px 30px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:850;letter-spacing:-.02em}
h2{font-size:25px;margin:0 0 14px;letter-spacing:-.03em} h3{margin:0 0 10px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);border-radius:12px;background:var(--btn);color:var(--text);padding:10px 14px;cursor:pointer;font-weight:700}
button:hover{background:var(--btnHover)}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}.danger{background:#fff1f2;border-color:#fecdd3;color:#b91c1c}.good{background:#ecfdf5;border-color:#bbf7d0;color:#166534}.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
body.dark .danger{background:#3b1116;color:#fecdd3;border-color:#7f1d1d} body.dark .good{background:#102a1a;color:#bbf7d0;border-color:#14532d} body.dark .warn{background:#3a2508;color:#fde68a;border-color:#78350f}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card);color:var(--text)} textarea{min-height:90px;resize:vertical}
.small{font-size:13px;color:var(--muted)}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px;background:var(--soft)}
.sep{height:1px;background:var(--line);margin:14px 0}
.subject-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.subject-card{cursor:pointer;transition:.15s transform,.15s box-shadow}.subject-card:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(14,165,233,.15)}
.subject-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dbeafe,#cffafe);font-size:24px;margin-bottom:12px}
body.dark .subject-icon{background:linear-gradient(135deg,#1e3a8a,#164e63)}
.breadcrumb{margin-bottom:14px;color:var(--muted);font-size:14px}.breadcrumb button{padding:6px 9px;border-radius:9px}
.group-box{margin:14px 0}.group-title{font-size:18px;font-weight:850;margin:0;color:var(--accent)}.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}.group-body.hidden{display:none!important}
.exam-list{display:flex;flex-direction:column;gap:10px}.group-panel{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}.group-panel-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px 18px;cursor:pointer}.group-panel-title{font-size:20px;font-weight:900;color:var(--accent);text-align:center;flex:1}.group-panel-body{border-top:1px solid var(--line);padding:14px;background:var(--soft)}.group-panel-body.hidden{display:none!important}.exam-card{width:100%;min-height:74px}.exam-left{display:flex;align-items:center;gap:12px;min-width:0}.exam-check{width:20px;height:20px;accent-color:var(--accent)}.batchbar{position:sticky;top:70px;z-index:4;margin-bottom:14px;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.exam-card{display:flex;gap:12px;align-items:center;justify-content:space-between}
.exam-card .name{font-weight:850}.exam-card .meta{font-size:13px;color:var(--muted)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px}.qnav button{padding:8px 0}.qnav .answered{border-color:var(--accent)}.qnav .wrong{background:rgba(220,38,38,.16);border-color:var(--bad)}.qnav .correct{background:rgba(22,163,74,.16);border-color:var(--good)}
.question-box{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:180px}.question-img,.explain-img{max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;display:block;margin:10px auto}
.answer-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.answer-buttons button{font-size:18px;padding:14px}.answer-buttons button.selected{outline:3px solid var(--accent);background:#dbeafe;color:#1d4ed8}body.dark .answer-buttons button.selected{background:#0c4a6e;color:#fff}
.result{padding:12px;border-radius:12px;border:1px solid var(--line);margin:10px 0}.result.ok{border-color:#22c55e;background:rgba(34,197,94,.12)}.result.no{border-color:#ef4444;background:rgba(239,68,68,.12)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal>.card{max-width:560px;width:100%}
.pasteBox{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--soft);color:var(--muted);min-height:92px}.pasteBox:focus{outline:3px solid var(--accent)}.preview{max-height:220px;object-fit:contain}
.badge{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:3px 9px;border-radius:999px;font-size:12px;font-weight:850}
@media(max-width:720px){header{flex-direction:column;align-items:stretch}.answer-buttons{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.exam-card{align-items:flex-start;flex-direction:column}}

.select-toolbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;width:min(1120px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 18px 50px rgba(37,99,235,.18);backdrop-filter:blur(10px)}
.select-toolbar .mainline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.select-toolbar .hint{font-size:13px;color:var(--muted);margin-top:6px}
.subjectViewPadding{padding-bottom:110px}
.exam-card.select-only{cursor:pointer;justify-content:space-between;min-height:68px}
.exam-card.select-only:hover{background:var(--soft)}
.exam-card.select-only .name{font-size:17px}
.exam-card.select-only input{flex:0 0 auto}


.editor-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.editor-row{display:grid;grid-template-columns:70px 1fr 100px 110px;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.editor-row img{max-height:80px;max-width:100%;object-fit:contain;background:white;border:1px solid var(--line);border-radius:10px}
.editor-row .pasteBox{min-height:72px;padding:12px}
.editor-actions{position:sticky;top:70px;z-index:3;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px;margin:12px 0;box-shadow:var(--shadow)}
.pdf-grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
.pdf-preview{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--soft);padding:10px}
.pdf-preview canvas{max-width:100%;display:block;margin:10px auto;border:1px solid var(--line);background:white}
.pdf-result{max-height:70vh;overflow:auto}
.auto-q-card{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:var(--card)}
.auto-q-card img{max-width:100%;max-height:180px;object-fit:contain;background:white;border:1px solid var(--line);border-radius:10px}
@media(max-width:900px){.pdf-grid{grid-template-columns:1fr}.editor-row{grid-template-columns:1fr}.editor-row img{max-height:180px}}


.manual-wrap{display:grid;grid-template-columns:minmax(320px,1.2fr) minmax(320px,.8fr);gap:14px}
.manual-page-box{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--soft);padding:10px;overflow:auto;max-height:78vh}
.manual-canvas-holder{position:relative;display:inline-block}
.manual-canvas-holder canvas{display:block;background:#fff;border:1px solid var(--line)}
.crop-rect{position:absolute;border:3px solid #2563eb;background:rgba(37,99,235,.12);pointer-events:none}
.crop-list{max-height:78vh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--soft)}
.crop-item{display:grid;grid-template-columns:56px 1fr 80px 80px;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0}
.crop-item img{max-width:100%;max-height:90px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.manual-toolbar{position:sticky;top:70px;z-index:4;background:color-mix(in srgb,var(--card) 96%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;box-shadow:var(--shadow)}
@media(max-width:900px){.manual-wrap{grid-template-columns:1fr}.crop-item{grid-template-columns:1fr}}


.crop-del-check{width:18px;height:18px;accent-color:var(--bad)}
.crop-delete-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.crop-delete-tools.hidden{display:none!important}


.edit-delete-check{width:20px;height:20px;accent-color:var(--bad);margin-right:8px}
.edit-delete-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.edit-delete-tools.hidden{display:none!important}


.exam-control-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.exam-control-row .grade-right{margin-left:auto}
@media(max-width:720px){.exam-control-row .grade-right{margin-left:0;width:100%}}


.solve-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
.answer-sheet{position:sticky;top:86px;align-self:start;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:12px;max-height:calc(100vh - 110px);overflow:auto}
.answer-sheet h3{margin:0 0 10px;text-align:center}
.answer-row{display:grid;grid-template-columns:34px repeat(4,28px) 28px;gap:5px;align-items:center;padding:4px;border-radius:8px}
.answer-row.current{background:rgba(37,99,235,.10)}
.answer-row .qno{font-weight:800;color:var(--accent);cursor:pointer}
.answer-bubble{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:var(--soft)}
.answer-bubble.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.answer-check{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--soft);font-size:14px}
.answer-check.marked{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.check-toggle.marked{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.qnav button.marked{box-shadow:inset 0 -4px 0 #f59e0b}
@media(max-width:900px){.solve-layout{grid-template-columns:1fr}.answer-sheet{position:relative;top:auto;max-height:none}}


.manual-wrap.resizable-manual{display:grid;grid-template-columns:minmax(360px,var(--pdf-pane-width,65%)) 10px minmax(280px,1fr);gap:0;align-items:start}
.manual-resizer{width:10px;cursor:col-resize;background:linear-gradient(180deg,transparent,var(--line),transparent);border-radius:999px;min-height:70vh;margin:0 8px}
.manual-resizer:hover{background:var(--accent)}
.manual-page-box{min-width:0}
.crop-list{min-width:0}
@media(max-width:900px){.manual-wrap.resizable-manual{display:block}.manual-resizer{display:none}}


@media(max-width:720px){
  .exam-control-row{gap:10px}
  .exam-control-row .grade-right{margin-top:10px;padding:14px 18px}
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header>
  <h1>등용문 CBT</h1>
  <div class="row">
    <button onclick="showHome()">홈</button>
    <button onclick="showWrongNote()">오답노트</button>
    <button onclick="openAdminLogin()">관리자</button>
    <button id="adminHomeBtn" class="hidden primary" onclick="showAdmin()">관리자 화면</button>
    <button id="adminExitBtn" class="hidden" onclick="exitAdmin()">관리자 나가기</button>
    <button onclick="toggleTheme()">다크/라이트</button>
    <button id="netlifyZipBtn" class="hidden" onclick="exportNetlifyZip()">Netlify ZIP 내보내기</button>
  </div>
</header>
<div class="wrap">
  <section id="homeView"></section>
  <section id="subjectView" class="hidden"></section>
  <section id="examView" class="hidden"></section>
  <section id="wrongView" class="hidden"></section>
  <section id="adminView" class="hidden"></section>
</div>
<div id="modalRoot"></div>
<script>
const DBKEY='cbt_manager_db_v3';
const OLDKEYS=['cbt_manager_db_v1'];
const STATEKEY='cbt_manager_state_v3';
const _gate='deungyongmun';
let db=loadDB(), state=loadState(), adminOn=false;
let session={subjectId:null,examId:null,qids:[],idx:0,answers:{},checked:false,results:{}};
let editDeleteMode=false;
let editDeleteSelected=new Set();

function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function loadDB(){
  try{
    let raw=localStorage.getItem(DBKEY);
    if(!raw){for(const k of OLDKEYS){if(localStorage.getItem(k)){raw=localStorage.getItem(k);break}}}
    const data=raw?JSON.parse(raw):{subjects:[],wrongNote:{}};
    normalizeDB(data); return data;
  }catch(e){return {subjects:[],wrongNote:{}}}
}
function normalizeDB(data){
  data.subjects=data.subjects||[]; data.wrongNote=data.wrongNote||{};
  data.subjects.forEach(s=>{s.groups=s.groups||[{id:'default',title:'기본'}];(s.exams||[]).forEach(e=>{e.groupId=e.groupId||'default';e.questions=e.questions||[]})});
}
function loadState(){try{return JSON.parse(localStorage.getItem(STATEKEY))||{}}catch(e){return {}}}
function saveState(){localStorage.setItem(STATEKEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hideAll(){['homeView','subjectView','examView','wrongView','adminView'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function getSubject(id){return db.subjects.find(s=>s.id===id)}
function getExam(sid,eid){return getSubject(sid)?.exams.find(e=>e.id===eid)}
function getQuestion(sid,eid,qid){return getExam(sid,eid)?.questions.find(q=>q.id===qid)}
function applyTheme(){document.body.classList.toggle('dark',(localStorage.getItem('cbt_theme')||'light')==='dark')}
function toggleTheme(){localStorage.setItem('cbt_theme',document.body.classList.contains('dark')?'light':'dark');applyTheme()}
function updateAdminButton(){
 const b=document.getElementById('adminExitBtn');
 const a=document.getElementById('adminHomeBtn');
 const z=document.getElementById('netlifyZipBtn');
 if(b)b.classList.toggle('hidden',!adminOn);
 if(a)a.classList.toggle('hidden',!adminOn);
 if(z)z.classList.toggle('hidden',!adminOn);
}
function exitAdmin(){
 adminOn=false;
 updateAdminButton();
 const adminView=document.getElementById('adminView');
 if(adminView && !adminView.classList.contains('hidden')) showHome();
}

function showHome(){
 hideAll(); const el=document.getElementById('homeView'); el.classList.remove('hidden');
 if(!db.subjects.length){
  el.innerHTML=`<div class="card"><h2>종목을 추가하세요</h2><p class="small">관리자 모드에서 종목/회차/문제를 추가할 수 있습니다. Netlify 공유용은 data.json 내보내기 후 index.html과 함께 올리면 됩니다.</p><button class="primary" onclick="openAdminLogin()">관리자 모드</button></div>`;return;
 }
 el.innerHTML=`<div class="row" style="margin-bottom:16px"><h2 style="margin:0">종목 선택</h2><span class="pill">총 ${db.subjects.length}개 종목</span></div>
 <div class="subject-list">${db.subjects.map(s=>`
  <div class="card subject-card" onclick="showSubject('${s.id}')">
    <div class="subject-icon">📘</div>
    <h3>${esc(s.title)}</h3>
    <p class="small">회차 ${s.exams.length}개 · 문제 ${s.exams.reduce((a,e)=>a+e.questions.length,0)}개</p>
    <button class="primary">이 종목 선택</button>
  </div>`).join('')}</div>`;
}

function groupCollapseKey(sid,gid){return `cbt_group_collapsed_${sid}_${gid}`}
function isGroupCollapsed(sid,gid){return localStorage.getItem(groupCollapseKey(sid,gid))==='1'}
function toggleGroup(sid,gid){
 const key=groupCollapseKey(sid,gid);
 localStorage.setItem(key,isGroupCollapsed(sid,gid)?'0':'1');
 const body=document.getElementById(`group_body_${sid}_${gid}`);
 const btn=document.getElementById(`group_btn_${sid}_${gid}`);
 const collapsed=isGroupCollapsed(sid,gid);
 if(body) body.classList.toggle('hidden',collapsed);
 if(btn) btn.textContent=collapsed?'펼치기':'접기';
}


let selectedExams = new Set();

function selKey(sid,eid){return sid+'|'+eid}
function setExamSelected(sid,eid,checked){
  const k=selKey(sid,eid);
  if(checked) selectedExams.add(k); else selectedExams.delete(k);
  updateSelectedCount();
}
function toggleExamCheck(card,sid,eid){
  const cb=card.querySelector('input[type="checkbox"]');
  cb.checked=!cb.checked;
  setExamSelected(sid,eid,cb.checked);
}
function updateSelectedCount(){
  const el=document.getElementById('selectedCount');
  if(el) el.textContent=selectedExams.size;
}
function selectAllVisibleExams(sid){
  const s=getSubject(sid); if(!s)return;
  s.exams.forEach(e=>selectedExams.add(selKey(sid,e.id)));
  showSubject(sid);
}
function clearSelectedExams(sid){
  if(sid){
    const s=getSubject(sid); if(s) s.exams.forEach(e=>selectedExams.delete(selKey(sid,e.id)));
  }else selectedExams.clear();
  showSubject(sid);
}
function startSelectedExams(sid,shuffle){
  const s=getSubject(sid); if(!s)return;
  let selected=s.exams.filter(e=>selectedExams.has(selKey(sid,e.id)));
  if(!selected.length){alert('풀 회차를 선택하세요.');return;}
  let qrefs=[];
  selected.forEach(e=>e.questions.forEach(q=>qrefs.push({eid:e.id,qid:q.id})));
  if(shuffle){
    for(let i=qrefs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qrefs[i],qrefs[j]]=[qrefs[j],qrefs[i]]}
  }
  session={subjectId:sid, examId:null, qids:qrefs.map(x=>x.qid), qrefs:qrefs, idx:0, answers:{}, checked:false, results:{}, title:`선택 ${selected.length}개 회차`, shuffle:!!shuffle};
  renderExam();
}

function showSubject(sid){
 hideAll(); const el=document.getElementById('subjectView'); el.classList.remove('hidden');
 el.classList.add('subjectViewPadding');
 const s=getSubject(sid); if(!s)return showHome();
 const groups=s.groups||[{id:'default',title:'기본'}];
 el.innerHTML=`<div class="breadcrumb"><button onclick="showHome()">← 종목 선택</button> / ${esc(s.title)}</div>
 <div class="row" style="margin-bottom:16px"><h2 style="margin:0">${esc(s.title)}</h2><span class="pill">회차 ${s.exams.length}개</span></div>
 <div class="select-toolbar">
   <div class="mainline">
     <b>선택 풀이</b>
     <span class="pill">선택 <span id="selectedCount">${[...selectedExams].filter(k=>k.startsWith(s.id+'|')).length}</span>개 회차</span>
     <button onclick="selectAllVisibleExams('${s.id}')">전체 선택</button>
     <button onclick="clearSelectedExams('${s.id}')">전체 해제</button>
     <button class="primary" onclick="startSelectedExams('${s.id}',false)">선택 회차 풀기</button>

function renderExam(){
 hideAll(); const el=document.getElementById('examView'); el.classList.remove('hidden');
 const s=getSubject(session.subjectId), ref=session.qrefs?session.qrefs[session.idx]:null, e=ref?getExam(session.subjectId,ref.eid):getExam(session.subjectId,session.examId), q=ref?getQuestion(session.subjectId,ref.eid,ref.qid):getQuestion(session.subjectId,session.examId,session.qids[session.idx]);
 if(!q){el.innerHTML='<div class="card">문제를 찾을 수 없습니다.</div>';return}
 const selected=session.answers[q.id];
 el.innerHTML=`<div class="card">

function renderQuestionResult(q){if(!session.checked||session.results[q.id]===undefined)return '';const ok=session.results[q.id],ans=session.answers[q.id];return `<div class="result ${ok?'ok':'no'}">${ok?'정답':'오답'} · 선택 ${ans||'-'} / 정답 ${q.answer}</div>`}
function currentQRef(){return session.qrefs?session.qrefs[session.idx]:{eid:session.examId,qid:session.qids[session.idx]}}
function chooseAnswer(n){const r=currentQRef();session.answers[r.qid]=n;renderExam()}
function goQ(i){session.idx=i;renderExam()} function prevQ(){if(session.idx>0)goQ(session.idx-1)} function nextQ(){if(session.idx<session.qids.length-1)goQ(session.idx+1)}
function gradeSession(){
 const refs=session.qrefs||session.qids.map(qid=>({eid:session.examId,qid}));
 const missingIndex=refs.findIndex(r=>!session.answers[r.qid]);
 if(missingIndex>=0){
   alert(`${missingIndex+1}번 문제가 아직 안 풀렸습니다. 안 푼 문제로 이동합니다.`);
   session.idx=missingIndex;
   renderExam();
   return;
 }
 session.checked=true;
 let score=0;
 refs.forEach(r=>{
   const q=getQuestion(session.subjectId,r.eid,r.qid), ok=session.answers[r.qid]===q.answer;
   session.results[r.qid]=ok;
   if(ok) score++; else addWrong(session.subjectId,r.eid,r.qid);
 });
 saveDB();
 alert(`채점 완료: ${score} / ${refs.length}`);
 renderExam();
}
function showExplanation(){const r=currentQRef();const q=getQuestion(session.subjectId,r.eid,r.qid);let body=q.explainType==='image'&&q.explainImage?`<img class="explain-img" src="${q.explainImage}">`:q.explainText?`<p style="white-space:pre-wrap">${esc(q.explainText)}</p>`:'<p class="small">해설이 없습니다.</p>';modal(`<h3>해설</h3><div class="result ok">정답: ${q.answer}번</div>${body}<div class="row"><button onclick="closeModal()">닫기</button></div>`)}

function wrongKey(sid,eid,qid){return `${sid}|${eid}|${qid}`} function addWrong(sid,eid,qid){
 const s=getSubject(sid);
 const e=s?getExam(sid,eid):null;
 const q=e?getQuestion(sid,eid,qid):null;

 // 깨진 데이터 또는 존재하지 않는 문제는 오답노트에 저장하지 않음
 if(!sid || !eid || !qid || !s || !e || !q) return;

 const idx=e.questions.findIndex(x=>x.id===qid);
 if(idx<0) return;

 const k=wrongKey(sid,eid,qid);
 const it=db.wrongNote[k]||{sid,eid,qid,count:0,last:''};
 it.count++;
 it.last=new Date().toLocaleString();
 db.wrongNote[k]=it;
}

function cleanWrongNote(){
 const cleaned={};
 Object.values(db.wrongNote||{}).forEach(it=>{
   if(!it || !it.sid || !it.eid || !it.qid) return;
   const s=getSubject(it.sid);
   const e=s?getExam(it.sid,it.eid):null;
   const q=e?getQuestion(it.sid,it.eid,it.qid):null;
   if(!s || !e || !q) return;
   const idx=e.questions.findIndex(x=>x.id===it.qid);
   if(idx<0) return;
   cleaned[wrongKey(it.sid,it.eid,it.qid)]={...it,sid:it.sid,eid:it.eid,qid:it.qid,count:it.count||1,last:it.last||''};
 });
 db.wrongNote=cleaned;
 saveDB();
}

function startWrongNoteExam(shuffle=false){
 cleanWrongNote(); const items=Object.values(db.wrongNote||{});
 if(!items.length)return alert('오답노트에 문제가 없습니다.');
 const first=items[0];
 let refs=items.filter(it=>getQuestion(it.sid,it.eid,it.qid)).map(it=>({sid:it.sid,eid:it.eid,qid:it.qid}));
 if(shuffle){for(let i=refs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[refs[i],refs[j]]=[refs[j],refs[i]]}}
 // 현재 시험 엔진은 한 종목 기준이라, 여러 종목이 섞이면 첫 종목만 사용한다.

 refs=refs.filter(r=>r.sid===sid);
 session={subjectId:sid,examId:null,qids:refs.map(r=>r.qid),qrefs:refs.map(r=>({eid:r.eid,qid:r.qid})),idx:0,answers:{},checked:false,results:{},title:`오답노트 ${refs.length}문제`};
 renderExam();
}

async function pasteImage(ev,el){ev.preventDefault();const item=[...ev.clipboardData.items].find(x=>x.type.startsWith('image/'));if(!item)return alert('클립보드에 이미지가 없습니다.');const data=await fileToDataURL(item.getAsFile()),p=el.closest('.qform');if(el.dataset.role==='qimg'){p.dataset.qimage=data;const img=p.querySelector('[data-role=qprev]');img.src=data;img.classList.remove('hidden')}else{p.dataset.expimage=data;const img=p.querySelector('[data-role=expprev]');img.src=data;img.classList.remove('hidden')}}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function saveNewExam(){markLocalDirty();const sid=document.getElementById('addSubjectSel').value,gid=document.getElementById('addGroupSel').value,title=document.getElementById('examTitle').value.trim();if(!title)return alert('회차 제목을 입력하세요.');const qs=[...document.querySelectorAll('.qform')].map(f=>({id:uid('q'),image:f.dataset.qimage||'',answer:parseInt(f.querySelector('[data-role=ans]').value),explainType:f.querySelector('[data-role=exptype]').value,explainText:f.querySelector('[data-role=exptext]').value||'',explainImage:f.dataset.expimage||''}));getSubject(sid).exams.push({id:uid('e'),groupId:gid,title,questions:qs});markLocalDirty();saveDB();alert('저장 완료');showAdmin();adminEditQuestions();setTimeout(()=>{document.getElementById('editS').value=sid;refreshEditExamSel();document.getElementById('editE').value=getSubject(sid).exams[getSubject(sid).exams.length-1].id;loadEditQuestions();},0)}

function initManualResizer(){
 const wrap=document.getElementById('manualResizableWrap');
 const resizer=document.getElementById('manualResizer');
 if(!wrap||!resizer)return;
 let dragging=false;
 resizer.onmousedown=(e)=>{dragging=true;document.body.style.cursor='col-resize';e.preventDefault();};
 window.onmousemove=(e)=>{
   if(!dragging)return;
   const rect=wrap.getBoundingClientRect();
   const pct=Math.max(38,Math.min(82,((e.clientX-rect.left)/rect.width)*100));
   wrap.style.setProperty('--pdf-pane-width',pct+'%');
   localStorage.setItem('cbt_pdf_pane_width',pct);
 };
 window.onmouseup=()=>{if(dragging){dragging=false;document.body.style.cursor='';}};
 const saved=localStorage.getItem('cbt_pdf_pane_width');
 if(saved)wrap.style.setProperty('--pdf-pane-width',saved+'%');
}

async function loadManualPdf(){
 const file=document.getElementById('manPdfInput').files[0];
 if(!file)return alert('PDF 파일을 선택하세요.');
 if(!window.pdfjsLib)return alert('PDF 기능을 불러오지 못했습니다. 인터넷 연결 또는 CDN 차단을 확인하세요.');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const buf=await file.arrayBuffer();
 manualPdf.pdf=await pdfjsLib.getDocument({data:buf}).promise;
 manualPdf.pageNo=1;
 manualPdf.crops=[];
 await renderManualPage();
 renderManualCropList();
}
async function renderManualPage(){
 if(!manualPdf.pdf)return;
 const page=await manualPdf.pdf.getPage(manualPdf.pageNo);
 const viewport=page.getViewport({scale:manualPdf.scale});
 const canvas=document.createElement('canvas');
 canvas.width=viewport.width; canvas.height=viewport.height;
 await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
 manualPdf.canvas=canvas;
 const holder=document.getElementById('manualCanvasHolder');
 holder.innerHTML='';
 holder.appendChild(canvas);
 holder.onmousedown=startManualDrag;
 holder.onmousemove=moveManualDrag;
 holder.onmouseup=endManualDrag;
 holder.onmouseleave=cancelManualDrag;
 document.getElementById('manualPageNow').textContent=`${manualPdf.pageNo} / ${manualPdf.pdf.numPages}`;
}
function manualPrevPage(){if(manualPdf.pdf && manualPdf.pageNo>1){manualPdf.pageNo--;renderManualPage()}}
function manualNextPage(){if(manualPdf.pdf && manualPdf.pageNo<manualPdf.pdf.numPages){manualPdf.pageNo++;renderManualPage()}}
function posInHolder(ev){
 const holder=document.getElementById('manualCanvasHolder');
 const r=holder.getBoundingClientRect();
 return {x:ev.clientX-r.left+holder.scrollLeft,y:ev.clientY-r.top+holder.scrollTop};
}
function startManualDrag(ev){
 if(ev.target.tagName!=='CANVAS')return;
 manualPdf.start=posInHolder(ev);
 const holder=document.getElementById('manualCanvasHolder');
 const rect=document.createElement('div');
 rect.className='crop-rect';
 rect.style.left=manualPdf.start.x+'px';rect.style.top=manualPdf.start.y+'px';rect.style.width='0px';rect.style.height='0px';
 holder.appendChild(rect);
 manualPdf.rect=rect;
}
function moveManualDrag(ev){
 if(!manualPdf.start||!manualPdf.rect)return;
 const p=posInHolder(ev);
 const x=Math.min(p.x,manualPdf.start.x), y=Math.min(p.y,manualPdf.start.y);
 const w=Math.abs(p.x-manualPdf.start.x), h=Math.abs(p.y-manualPdf.start.y);
 manualPdf.rect.style.left=x+'px';manualPdf.rect.style.top=y+'px';manualPdf.rect.style.width=w+'px';manualPdf.rect.style.height=h+'px';
}
function endManualDrag(ev){
 if(!manualPdf.start||!manualPdf.rect)return;
 const p=posInHolder(ev);
 const x=Math.round(Math.min(p.x,manualPdf.start.x)), y=Math.round(Math.min(p.y,manualPdf.start.y));
 const w=Math.round(Math.abs(p.x-manualPdf.start.x)), h=Math.round(Math.abs(p.y-manualPdf.start.y));
 manualPdf.rect.remove(); manualPdf.rect=null; manualPdf.start=null;
 if(w<30||h<30)return;
 cropManualRect(x,y,w,h);
}
function cancelManualDrag(){
 if(manualPdf.rect){manualPdf.rect.remove();manualPdf.rect=null}
 manualPdf.start=null;
}
function cropManualRect(x,y,w,h){
 const src=manualPdf.canvas;
 const c=document.createElement('canvas');
 c.width=w;c.height=h;
 c.getContext('2d').drawImage(src,x,y,w,h,0,0,w,h);
 manualPdf.crops.push({image:c.toDataURL('image/jpeg',0.9),answer:1,explainType:'none',explainText:'',explainImage:''});
 renderManualCropList();
}

 list.innerHTML=manualPdf.crops.map((q,i)=>`<div class="crop-item">
   ${manualPdf.deleteMode?`<input class="crop-del-check" type="checkbox" ${manualPdf.selectedDeletes.has(i)?'checked':''} onchange="setManualDeleteChecked(${i},this.checked)">`:`<b>${i+1}번</b>`}
   <img src="${q.image}">
   <select onchange="manualPdf.crops[${i}].answer=parseInt(this.value)">${[1,2,3,4].map(n=>`<option value="${n}" ${q.answer===n?'selected':''}>${n}</option>`).join('')}</select>
   ${manualPdf.deleteMode?`<span class="small">삭제 선택</span>`:`<button class="danger" onclick="deleteManualCrop(${i})">삭제</button>`}
 </div>`).join('');
}
function toggleManualDeleteMode(force){
 manualPdf.deleteMode = (typeof force==='boolean') ? force : !manualPdf.deleteMode;
 manualPdf.selectedDeletes = new Set();
 renderManualCropList();
}
function setManualDeleteChecked(i,checked){
 if(checked) manualPdf.selectedDeletes.add(i); else manualPdf.selectedDeletes.delete(i);
}
function deleteSelectedManualCrops(){
 const arr=[...manualPdf.selectedDeletes].sort((a,b)=>b-a);
 if(!arr.length)return alert('삭제할 문제를 체크하세요.');

 arr.forEach(i=>manualPdf.crops.splice(i,1));
 manualPdf.selectedDeletes=new Set();
 manualPdf.deleteMode=false;
 renderManualCropList();
}
function deleteManualCrop(i){manualPdf.crops.splice(i,1);renderManualCropList()}
function clearManualCrops(){if(confirm('잘라낸 문제를 모두 삭제할까요?')){manualPdf.crops=[];manualPdf.selectedDeletes=new Set();renderManualCropList()}}

   images.push(...cuts);
 }

function autoCutPage(canvas, perPage, remain){
 const out=[];
 const w=canvas.width, h=canvas.height;
 const marginX=Math.round(w*0.06), top=Math.round(h*0.07), bottom=Math.round(h*0.06);
 const usableH=h-top-bottom;
 const n=Math.min(perPage, remain);
 for(let i=0;i<n;i++){
   const y=top+Math.floor(usableH*i/perPage);
   const y2=top+Math.floor(usableH*(i+1)/perPage);
   const ch=y2-y;
   const c=document.createElement('canvas');
   c.width=w-marginX*2; c.height=ch;
   c.getContext('2d').drawImage(canvas, marginX, y, c.width, ch, 0, 0, c.width, ch);
   out.push(c.toDataURL('image/jpeg',0.86));
 }
 return out;
}

async function fetchImageBlobForZip(path){
  const clean = String(path || '').replace(/^\.?\//,'');
  const res = await fetch(clean + '?ts=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('이미지 다운로드 실패: ' + clean);
  return await res.blob();
}
function fileNameFromImagePath(path, fallback){
  const clean = String(path || '').split('?')[0].split('#')[0];
  const name = clean.split('/').pop();
  return name || fallback;
}

function dataUrlToBlob(dataUrl){
  const parts=dataUrl.split(',');
  const mime=(parts[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(parts[1]||'');
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function imageToWebpBlob(src, quality=0.82){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.naturalWidth||img.width;
      c.height=img.naturalHeight||img.height;
      c.getContext('2d').drawImage(img,0,0);
      c.toBlob(b=>b?resolve(b):reject(new Error('WebP 변환 실패')),'image/webp',quality);
    };
    img.onerror=reject;
    img.src=src;
  });
}
function safeFilePart(s){
  return String(s||'item').replace(/[\\/:*?"<>|#%&{}$!`'@+=]/g,'_').replace(/\s+/g,'_').slice(0,60);
}
async function exportNetlifyZip(){
  if(!window.JSZip){
    alert('ZIP 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.');
    return;
  }
  if(!db.subjects || !db.subjects.length){
    alert('내보낼 문제가 없습니다.');
    return;
  }
  const ok=confirm('Netlify 업로드용 ZIP을 생성합니다. 기존 서버 이미지도 다시 받아서 images 폴더에 포함합니다.');
  if(!ok)return;

  const zip=new JSZip();
  const imagesFolder=zip.folder('images');
  const outData=JSON.parse(JSON.stringify({
    meta:{
      app:'등용문 CBT',
      version:'netlify-webp-portable',
      exportedAt:new Date().toISOString(),
      note:'Netlify 배포용 데이터입니다. 문제 이미지는 images 폴더의 WebP 파일을 참조합니다.'
    },
    subjects:db.subjects||[],
    wrongNote:{}
  }));

  let count=0, fetched=0, converted=0, failed=0;
  const failedImages=[];
  const usedNames=new Set();

  function uniqueName(name){
    let safe=String(name||'image.webp').replace(/[\\/:*?"<>|#%&{}$!`'@+=]/g,'_').replace(/\s+/g,'_');
    if(!safe.includes('.')) safe += '.webp';
    let base=safe.replace(/(\.[^.]+)$/,'');
    let ext=(safe.match(/(\.[^.]+)$/)||['.webp'])[0];
    let out=safe, n=2;
    while(usedNames.has(out)){ out=`${base}_${n}${ext}`; n++; }
    usedNames.add(out);
    return out;
  }

  async function handleImageField(q, field, prefix, s, e, qi){
    const val=q[field];
    if(!val) return;

    if(String(val).startsWith('data:image')){
      count++;
      const fname=uniqueName(`${prefix}_${safeFilePart(s.title)}_${safeFilePart(e.title)}_${String(qi+1).padStart(3,'0')}_${String(count).padStart(6,'0')}.webp`);
      try{
        const blob=await imageToWebpBlob(val,0.82);
        imagesFolder.file(fname,blob);
        q[field]='images/'+fname;
        converted++;
      }catch(err){
        const blob=dataUrlToBlob(val);
        const fallback=uniqueName(fname.replace(/\.webp$/,'.png'));
        imagesFolder.file(fallback,blob);
        q[field]='images/'+fallback;
        converted++;
      }
      return;
    }

    if(String(val).startsWith('images/')){
      count++;
      const fname=uniqueName(fileNameFromImagePath(val, `${prefix}_${String(count).padStart(6,'0')}.webp`));
      try{
        const blob=await fetchImageBlobForZip(val);
        imagesFolder.file(fname,blob);
        q[field]='images/'+fname;
        fetched++;
      }catch(err){
        console.warn(err);
        failed++;
        failedImages.push(String(val));
        q[field]=val;
      }
      return;
    }
  }

  for(const s of outData.subjects){
    for(const e of (s.exams||[])){
      for(let qi=0; qi<(e.questions||[]).length; qi++){
        const q=e.questions[qi];
        await handleImageField(q,'image','q',s,e,qi);
        await handleImageField(q,'explainImage','explain',s,e,qi);
      }
    }
  }

  if(failed>0){
    const preview=failedImages.slice(0,20).map(x=>'• '+x).join('\n');
    const more=failedImages.length>20?`\n외 ${failedImages.length-20}개`:'';
    alert(`ZIP 생성을 중단했습니다.\n이미지 ${failed}개를 가져오지 못했습니다.\n누락된 이미지가 있는 ZIP은 생성하지 않습니다.\n\n실패 경로:\n${preview}${more}`);
    return;
  }

  zip.file('data.json', JSON.stringify(outData,null,2));

  let htmlText='';
  try{
    const res=await fetch(location.href.split('#')[0],{cache:'no-store'});
    if(res.ok) htmlText=await res.text();
  }catch(e){}
  if(!htmlText){
    htmlText='<!doctype html>\n'+document.documentElement.outerHTML;
  }
  zip.file('index.html', htmlText);

  const readme=`등용문 CBT GitHub Pages 업로드 주의사항

[ZIP 구성]
- index.html
- data.json
- images/
- README.txt

※ image-manifest.json 같은 별도 이미지 JSON 파일은 생성하지 않습니다.

[반드시 지켜야 할 업로드 순서]
1. 내려받은 ZIP 파일을 먼저 완전히 압축 해제합니다.
2. ZIP 내부 화면에서 파일을 바로 드래그하지 마세요.
3. GitHub 저장소의 기존 images 폴더를 먼저 삭제하고 커밋합니다.
4. 압축 해제된 새 images 폴더를 통째로 업로드합니다.
5. data.json은 항상 새 파일로 교체합니다.
6. index.html은 프로그램이 변경된 경우 새 파일로 교체합니다.

[중요]
- GitHub 웹 업로드는 같은 이름의 파일은 덮어쓰지만, 예전에 있던 불필요한 파일을 자동으로 삭제하지 않습니다.
- 따라서 이미지 삭제나 교체 내용을 정확히 반영하려면 기존 images 폴더를 지운 뒤 새 images 폴더 전체를 올려야 합니다.
- ZIP 안의 files/folders는 반드시 압축 해제된 실제 폴더에서 업로드하세요. 압축 파일 내부에서 직접 드래그하면 images 폴더 구조가 깨질 수 있습니다.
- “ZIP 생성을 중단했습니다” 메시지가 나오면 기존 이미지 중 일부를 가져오지 못한 상태입니다. 불완전한 ZIP은 생성되지 않으므로, GitHub Pages 배포 상태와 images 경로를 확인한 뒤 다시 생성하세요.
- ZIP 생성 완료 메시지에서 이미지 다운로드 실패가 0개인지 확인하세요.

[기타]
- 오답노트와 문제 체크 기록은 각 사용자 브라우저에 저장됩니다.
- data.json에는 이미지 경로가 저장되고 실제 이미지는 images 폴더에 들어 있습니다.
- 생성된 ZIP은 날짜별로 별도 보관하는 것을 권장합니다.
`;
  zip.file('README.txt',readme);

  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='deungyongmun_cbt_netlify_'+new Date().toISOString().slice(0,10)+'.zip';
  a.click();
  URL.revokeObjectURL(a.href);

  let msg=`ZIP 생성 완료\n`;
  msg+=`새로 변환한 이미지: ${converted}개\n`;
  msg+=`서버에서 다시 받은 이미지: ${fetched}개\n`;
  msg+=`이미지 다운로드 실패: 0개`;
  alert(msg);
}
